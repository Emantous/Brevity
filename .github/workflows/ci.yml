name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run test:smoke

  package:
    runs-on: ubuntu-latest
    needs: integration
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run package -- --out brevity.vsix
      - run: npm run package:check

      - uses: actions/upload-artifact@v4
        with:
          name: brevity-vsix
          path: brevity.vsix
          if-no-files-found: error
