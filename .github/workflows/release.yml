name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run package -- --out brevity.vsix
      - run: npm run package:check
      - run: sha256sum brevity.vsix > brevity.vsix.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            brevity.vsix
            brevity.vsix.sha256
